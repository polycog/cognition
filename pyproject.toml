[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polycog-cognition"
dynamic = ["version"]
dependencies = [
    "pydantic-ai-slim[spec] ~= 2.56.0",
    "networkx ~= 3.7",
    "types-networkx ~= 3.6.1.20261006",
]
requires-python = ">=3.13"
authors = [
    { name="Nate Derbinsky", email="nate@polycog.ai" },
    { name="Shiwali Mohan",  email="shiwali@polycog.ai" },
]
description = "Polycog cognition library"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Operating System :: OS Independent",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "ai",
    "neurosymbolic",
]

[project.urls]
Homepage = "https://polycog.ai"
Repository = "https://github.com/polycog/cognition.git"

[tool.setuptools.dynamic]
version = {attr = "cognition.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cognition" = ["py.typed", "AGENTS.md"]

[tool.black]
target-version = ["py313",]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pylint.MAIN]
ignored-classes = ["AttrReferral"]

[tool.pylint.similarities]
min-similarity-lines=8
