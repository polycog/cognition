name: docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source at the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          # ref: ${{ github.event.release.tag_name }}
          path: source
          token: ${{ secrets.DEPLOY_PAT }}
      
      - name: Setup Python v3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Install requirements
        working-directory: source/docs
        run: pip install -r requirements.txt
      
      - name: Build
        working-directory: source/docs
        run: make html
      
      - name: Check out target repo
        uses: actions/checkout@v6
        with:
          repository: polycog/cognition-docs.github.io
          token: ${{ secrets.DEPLOY_PAT }}
          path: target

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
      
      - name: Sync build output
        run: |
          rsync -v --delete --recursive --progress --exclude='.git' --exclude='.gitignore' --exclude='_sources' --exclude '.nojekyll' --exclude "CNAME" --exclude ".buildinfo" source/docs/build/html/ target/
      
      # - name: Sync build output
      #   run: |
      #     ls -al target
      #     git -C target status

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Build from ${{ github.repository }} ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}"
          git push
